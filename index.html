<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Death Sound Mod Statistics</title>
    <link rel="icon" type="image/webp" href="https://cdn.modrinth.com/data/M57SG5rk/ea0bc1e3fcb464776bad577eb2f061b2376c3095_96.webp">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            background-color: #0b0c10;
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 300px;
            background: radial-gradient(circle, rgba(62, 207, 142, 0.08) 0%, rgba(255, 77, 77, 0.05) 50%, rgba(0,0,0,0) 70%);
            filter: blur(60px);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            text-align: center;
            max-width: 950px; 
            width: 100%;
            position: relative; 
            z-index: 1;
        }

        .header-area {
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .mod-logo {
            width: 96px;
            height: 96px;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        h1 { 
            font-size: 2.6rem; 
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .dashboard-grid {
            display: flex;
            gap: 20px;
            width: 100%;
            margin-bottom: 35px;
        }

        .stat-card {
            background: #16181e;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 22px 25px;
            flex: 1;
            min-width: 0;
            text-align: left;
            transition: transform 0.25s ease, border-color 0.25s ease;
            user-select: none;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .card-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #8a8f98;
            margin-bottom: 6px;
        }

        .card-value { 
            font-size: 2.8rem; 
            font-weight: 700; 
            line-height: 1em;
            display: flex;
            align-items: baseline;
            height: 1em;
            font-variant-numeric: tabular-nums;
        }

        #sounds-card .card-value { color: #3ecf8e; }
        #deaths-card .card-value { color: #ff4d4d; }
        #pops-card .card-value { color: #ffcc00; }

        .info-section {
            background: #12141a;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .badge-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .badge-container a {
            display: inline-block;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .badge-container a:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .badge-container img {
            display: block;
            height: auto;
        }

        .footer {
            color: #5a5e67;
            font-size: 0.85rem;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .footer a {
            color: #8a8f98;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: #ffffff;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="container">
        
        <div class="header-area">
            <img class="mod-logo" src="https://cdn.modrinth.com/data/M57SG5rk/ea0bc1e3fcb464776bad577eb2f061b2376c3095_96.webp" alt="Mod Logo">
            <h1>Death Sound Mod Statistics</h1>
        </div>

        <div class="dashboard-grid">
            <div class="stat-card" id="sounds-card">
                <div class="card-label">Played Sounds</div>
                <div class="card-value" id="sound_count">4M+</div>
            </div>

            <div class="stat-card" id="deaths-card">
                <div class="card-label">Total Deaths</div>
                <div class="card-value" id="total_deaths">7M+</div>
            </div>

            <div class="stat-card" id="pops-card">
                <div class="card-label">Total Totem Pops</div>
                <div class="card-value" id="pops_session">9M+</div>
            </div>
        </div>

        <div class="info-section">
            <div class="badge-container">
                <a href="https://modrinth.com/mod/death-sound-mod">
                    <img src="https://wsrv.nl/?url=https%3A%2F%2Fcdn.jsdelivr.net%2Fnpm%2F%40intergrav%2Fdevins-badges%403%2Fassets%2Fcozy%2Favailable%2Fmodrinth_vector.svg&n=-1" alt="Modrinth" width="160">
                </a>
                <a href="https://www.curseforge.com/minecraft/mc-mods/death-sound-mod">
                    <img src="https://wsrv.nl/?url=https%3A%2F%2Fcdn.jsdelivr.net%2Fnpm%2F%40intergrav%2Fdevins-badges%403%2Fassets%2Fcozy%2Favailable%2Fcurseforge_vector.svg&n=-1" alt="CurseForge" width="167">
                </a>
            </div>
        </div>

        <div class="footer">
            <a href="https://modrinth.com/mod/death-sound-mod" target="_blank">Modrinth</a>
            <span>•</span>
            <a href="https://www.curseforge.com/minecraft/mc-mods/death-sound-mod" target="_blank">CurseForge</a>
            <span>•</span>
            <a href="https://github.com/wellwellwellguy/Death-Sound-Mod/issues" target="_blank">GitHub</a>
        </div>

    </div>

</body>
</html>
