<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Death Sound Mod Statistics</title>
    <link rel="icon" type="image/webp" href="https://cdn.modrinth.com/data/M57SG5rk/ea0bc1e3fcb464776bad577eb2f061b2376c3095_96.webp">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            background-color: #0b0c10;
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 950px; 
            width: 100%;
            position: relative; 
        }

        .header-area {
            margin-bottom: 35px;
            text-align: center;
        }

        h1 { 
            font-size: 2.6rem; 
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #8a8f98;
            margin-top: 6px;
        }

        .dashboard-grid {
            display: flex;
            gap: 20px;
            width: 100%;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #16181e;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 22px 25px;
            flex: 1;
            min-width: 0;
            text-align: left;
            transition: transform 0.25s ease, border-color 0.25s ease;
            user-select: none;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .card-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #8a8f98;
            margin-bottom: 6px;
        }

        .card-value { 
            font-size: 2.8rem; 
            font-weight: 700; 
            line-height: 1em;
            display: flex;
            align-items: baseline;
            height: 1em;
            font-variant-numeric: tabular-nums;
        }

        .odometer-digit {
            position: relative;
            display: inline-block;
            height: 1em;
            overflow: hidden;
            vertical-align: top;
        }

        .odometer-ribbon {
            display: flex;
            flex-direction: column;
            transition: transform 4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .odometer-num {
            height: 1em;
            line-height: 1em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #sounds-card .card-value { color: #3ecf8e; }
        #deaths-card .card-value { color: #ff4d4d; }
        #pops-card .card-value { color: #ffcc00; }

        .chart-wrapper {
            position: relative;
            width: 100%;
        }

        .chart-container {
            background: #12141a;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            position: relative;
            height: 400px;
            width: 100%;
            box-shadow: 0 20px 45px rgba(0,0,0,0.3);
        }

        .side-logo {
            position: absolute;
            right: -320px;
            top: 50%;
            transform: translateY(-50%);
            width: 270px;
            height: auto;
            object-fit: contain;
            filter: none;
            pointer-events: none; 
        }

        .error-msg {
            color: #ff4d4d;
            font-family: monospace;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        @media (max-width: 1600px) {
            .side-logo {
                position: static;
                transform: none;
                display: block;
                margin: 30px auto 0 auto;
                width: 200px;
            }
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header-area">
            <h1>Death Sound Mod Statistics</h1>
            <div class="subtitle">Auto-updates every 10 seconds</div>
        </div>

        <div class="dashboard-grid">
            <div class="stat-card" id="sounds-card">
                <div class="card-label">Played Sounds</div>
                <div class="card-value" id="sound_count"></div>
            </div>

            <div class="stat-card" id="deaths-card">
                <div class="card-label">Total Deaths</div>
                <div class="card-value" id="total_deaths"></div>
            </div>

            <div class="stat-card" id="pops-card">
                <div class="card-label">Total Totem Pops</div>
                <div class="card-value" id="pops_session"></div>
            </div>
        </div>

        <div class="chart-wrapper">
            <div class="chart-container">
                <canvas id="realtimeChart"></canvas>
            </div>
            <img class="side-logo" src="https://cdn.modrinth.com/data/M57SG5rk/ea0bc1e3fcb464776bad577eb2f061b2376c3095_96.webp" alt="Mod Logo">
        </div>

        <div class="error-msg" id="error"></div>
    </div>

    <script>
        const API_URL = "https://ekhjtgcsblponrszizxn.supabase.co/rest/v1/rpc/get_all_stats";
        const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVraGp0Z2NzYmxwb25yc3ppenhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxODIxNjUsImV4cCI6MjA5ODc1ODE2NX0.xQn5x4bIrTeirJEDJvG_tQPC-6itnCoTiWeRuwE8gt4";
        
        let history = {
            labels: [],
            sounds: [],
            deaths: [],
            pops: []
        };

        function formatShortNumber(value) {
            if (value >= 1000000000) {
                return (value / 1000000000).toLocaleString('de-DE', { maximumFractionDigits: 2 }) + 'B';
            }
            if (value >= 1000000) {
                return (value / 1000000).toLocaleString('de-DE', { maximumFractionDigits: 2 }) + 'M';
            }
            if (value >= 1000) {
                return (value / 1000).toLocaleString('de-DE', { maximumFractionDigits: 2 }) + 'K';
            }
            return value.toLocaleString('de-DE');
        }

        function updateOdometer(element, newValue) {
            const formatted = Number(newValue).toLocaleString('de-DE');
            
            if (!element.dataset.initialized) {
                element.innerHTML = '';
                for (let i = 0; i < formatted.length; i++) {
                    const char = formatted[i];
                    if (isNaN(parseInt(char, 10))) {
                        const span = document.createElement('span');
                        span.innerText = char;
                        span.style.lineHeight = "1em";
                        element.appendChild(span);
                    } else {
                        const digitContainer = document.createElement('div');
                        digitContainer.className = 'odometer-digit';
                        const ribbon = document.createElement('div');
                        ribbon.className = 'odometer-ribbon';
                        
                        for (let cycle = 0; cycle < 2; cycle++) {
                            for (let n = 0; n <= 9; n++) {
                                const numDiv = document.createElement('div');
                                numDiv.className = 'odometer-num';
                                numDiv.innerText = n;
                                ribbon.appendChild(numDiv);
                            }
                        }
                        
                        digitContainer.appendChild(ribbon);
                        element.appendChild(digitContainer);
                        
                        const targetNum = parseInt(char, 10);
                        ribbon.dataset.val = targetNum;
                        ribbon.style.transition = 'none';
                        ribbon.style.transform = `translateY(-${(targetNum / 20) * 100}%)`;
                    }
                }
                element.dataset.currentValue = formatted;
                element.dataset.initialized = "true";
                return;
            }

            if (element.dataset.currentValue === formatted) return;

            if (element.dataset.currentValue.length !== formatted.length) {
                element.dataset.initialized = "";
                updateOdometer(element, newValue);
                return;
            }

            const children = element.childNodes;
            for (let i = 0; i < formatted.length; i++) {
                const char = formatted[i];
                if (!isNaN(parseInt(char, 10))) {
                    const targetNum = parseInt(char, 10);
                    const ribbon = children[i].querySelector('.odometer-ribbon');
                    if (ribbon) {
                        const prevNum = parseInt(ribbon.dataset.val || "0", 10);
                        
                        let finalIndex = targetNum;
                        if (targetNum < prevNum) {
                            finalIndex = targetNum + 10;
                        }

                        ribbon.style.transition = 'transform 4s cubic-bezier(0.16, 1, 0.3, 1)';
                        ribbon.style.transform = `translateY(-${(finalIndex / 20) * 100}%)`;
                        ribbon.dataset.val = targetNum;

                        if (finalIndex >= 10) {
                            setTimeout(() => {
                                ribbon.style.transition = 'none';
                                ribbon.style.transform = `translateY(-${(targetNum / 20) * 100}%)`;
                            }, 4000);
                        }
                    }
                }
            }

            element.dataset.currentValue = formatted;
        }

        const ctx = document.getElementById('realtimeChart').getContext('2d');
        const realtimeChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: history.labels,
                datasets: [
                    {
                        label: 'Played Sounds',
                        data: history.sounds,
                        borderColor: '#3ecf8e',
                        backgroundColor: 'rgba(62, 207, 142, 0.03)',
                        borderWidth: 3,
                        tension: 0.3,
                        fill: true,
                        pointRadius: 3,
                        pointHoverRadius: 3,
                        hitRadius: 20
                    },
                    {
                        label: 'Total Deaths',
                        data: history.deaths,
                        borderColor: '#ff4d4d',
                        backgroundColor: 'rgba(255, 77, 77, 0.03)',
                        borderWidth: 3,
                        tension: 0.3,
                        fill: true,
                        pointRadius: 3,
                        pointHoverRadius: 3,
                        hitRadius: 20
                    },
                    {
                        label: 'Total Totem Pops',
                        data: history.pops,
                        borderColor: '#ffcc00',
                        backgroundColor: 'rgba(255, 204, 0, 0.03)',
                        borderWidth: 3,
                        tension: 0.3,
                        fill: true,
                        pointRadius: 3,
                        pointHoverRadius: 3,
                        hitRadius: 20
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false
                },
                plugins: {
                    legend: { labels: { color: '#8a8f98', font: { size: 12, weight: 'bold' } } },
                    tooltip: {
                        displayColors: false,
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (label) {
                                    label += ': ';
                                }
                                if (context.parsed.y !== null) {
                                    label += formatShortNumber(context.parsed.y);
                                }
                                return label;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: { color: 'rgba(255, 255, 255, 0.02)' },
                        ticks: { color: '#8a8f98', maxRotation: 0 }
                    },
                    y: {
                        grid: {
                            color: 'rgba(255, 255, 255, 0.04)'
                        },
                        ticks: {
                            color: '#8a8f98',
                            callback: function(value) {
                                return formatShortNumber(value);
                            }
                        },
                        grace: '5%'
                    }
                }
            }
        });

        function updateStats() {
            fetch(API_URL, {
                method: "POST",
                headers: { 
                    "apikey": API_KEY, 
                    "Authorization": `Bearer ${API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({})
            })
            .then(res => {
                if (!res.ok) throw new Error("HTTP Error: " + res.status);
                return res.json();
            })
            .then(data => {
                if (data && data[0]) {
                    const currentSounds = data[0].sound_count ?? 0;
                    const currentDeaths = data[0].total_deaths ?? 0;
                    const currentPops = data[0].total_pops ?? 0; 

                    updateOdometer(document.getElementById("sound_count"), currentSounds);
                    updateOdometer(document.getElementById("total_deaths"), currentDeaths);
                    updateOdometer(document.getElementById("pops_session"), currentPops);

                    const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                    history.labels.push(now);
                    history.sounds.push(currentSounds);
                    history.deaths.push(currentDeaths);
                    history.pops.push(currentPops);

                    if (history.labels.length > 30) {
                        history.labels.shift();
                        history.sounds.shift();
                        history.deaths.shift();
                        history.pops.shift();
                    }

                    realtimeChart.update();
                }
            })
            .catch(err => {
                document.getElementById("error").innerText = "Connection Error: " + err.message;
                console.error(err);
            });
        }

        function startAlignedUpdates() {
            updateStats();

            const now = new Date();
            const delay = (10 - (now.getSeconds() % 10)) * 1000 - now.getMilliseconds();

            setTimeout(() => {
                updateStats();
                setInterval(updateStats, 10000);
            }, delay);
        }

        startAlignedUpdates();
    </script>
</body>
</html>
